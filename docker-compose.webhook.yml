# Override для режима webhook. Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.webhook.yml up --build -d
#
# Требуется в .env: DOMAIN, WEBHOOK_URL=https://<DOMAIN>, WEBHOOK_SECRET,
# WEBHOOK_PORT=8080. DNS A-запись домена должна указывать на IP сервера,
# порты 80 и 443 открыты (Caddy получает TLS-сертификат Let's Encrypt).
services:
  bot:
    # Бот сам решает режим по WEBHOOK_URL из .env; публичный порт не открываем —
    # доступ идёт через Caddy по внутренней сети (bot:8080).
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
